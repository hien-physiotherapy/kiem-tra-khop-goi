<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kiểm Tra Khớp Gối Trong 60 Giây</title>
  <style>
    :root {
      --bg: #F8FAFC;
      --card: #FFFFFF;
      --text: #0F172A;
      --muted: #475569;
      --teal: #0F766E;
      --teal-dark: #115E59;
      --teal-soft: #F0FDFA;
      --border: #CBD5E1;
      --warn-bg: #FFFBEB;
      --warn-border: #D97706;
      --warn-text: #92400E;
      --danger-bg: #FEF2F2;
      --danger-border: #DC2626;
      --danger-text: #991B1B;
      --avoid-bg: #FFF7ED;
      --avoid-border: #EA580C;
      --avoid-text: #9A3412;
      --zalo: #0068FF;
      --zalo-dark: #0052CC;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px 14px 48px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 18px;
      line-height: 1.65;
      color: var(--text);
      background-color: var(--bg);
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    .card {
      background: var(--card);
      border: 1px solid #E2E8F0;
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    .badge {
      display: inline-block;
      background: var(--teal-soft);
      color: var(--teal);
      border: 1px solid #99F6E4;
      font-size: 15px;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 999px;
      margin-bottom: 10px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.3;
      color: var(--text);
    }

    .subtitle {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 18px;
    }

    .progress-wrap {
      margin-bottom: 22px;
    }

    .progress-label {
      display: flex;
      justify-content: space-between;
      font-size: 16px;
      font-weight: 600;
      color: var(--teal-dark);
      margin-bottom: 8px;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: #E2E8F0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      width: 33.33%;
      background: var(--teal);
      transition: width 0.25s ease;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 22px;
      line-height: 1.35;
    }

    .q-block {
      margin-bottom: 24px;
      padding-bottom: 18px;
      border-bottom: 1px solid #F1F5F9;
    }

    .q-block:last-of-type {
      border-bottom: none;
      padding-bottom: 0;
    }

    .q-title {
      font-weight: 700;
      font-size: 19px;
      margin-bottom: 10px;
      color: var(--text);
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .option-btn {
      width: 100%;
      text-align: left;
      padding: 16px 18px;
      font-size: 18px;
      line-height: 1.45;
      color: var(--text);
      background: #FFFFFF;
      border: 2px solid var(--border);
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .option-btn:hover {
      border-color: var(--teal);
      background: var(--teal-soft);
    }

    .option-btn.selected {
      border-color: var(--teal);
      background: var(--teal-soft);
      font-weight: 700;
      box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.15);
    }

    .nav-row {
      display: flex;
      gap: 12px;
      margin-top: 22px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 20px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      border: none;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s ease, opacity 0.15s ease;
    }

    .btn-primary {
      background: var(--teal);
      color: #FFFFFF;
      flex: 1;
      min-width: 180px;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--teal-dark);
    }

    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-secondary {
      background: #F1F5F9;
      color: var(--text);
      border: 1px solid #CBD5E1;
    }

    .btn-secondary:hover {
      background: #E2E8F0;
    }

    .cta-box {
      background: #EFF6FF;
      border: 2px solid #BFDBFE;
      border-radius: 14px;
      padding: 18px;
      margin-top: 16px;
    }

    .cta-box h3 {
      margin: 0 0 6px;
      font-size: 19px;
      color: #1E3A8A;
    }

    .cta-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .btn-zalo {
      background: var(--zalo);
      color: #FFFFFF;
      padding: 14px 20px;
      font-size: 18px;
      border-radius: 12px;
      flex: 1;
      min-width: 220px;
      text-align: center;
    }

    .btn-zalo:hover {
      background: var(--zalo-dark);
    }

    .btn-copy {
      background: #FFFFFF;
      color: #1E3A8A;
      border: 2px solid #93C5FD;
      padding: 13px 18px;
      font-size: 17px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
    }

    .btn-copy:hover {
      background: #DBEAFE;
    }

    .copy-status {
      margin-top: 8px;
      font-size: 15px;
      font-weight: 600;
      color: #15803D;
    }

    .summary-box {
      background: #F8FAFC;
      border: 1px solid #CBD5E1;
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .summary-box h3 {
      margin: 0 0 10px;
      font-size: 18px;
      color: var(--text);
    }

    .summary-list {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 17px;
    }

    .summary-list li {
      margin-bottom: 6px;
      padding-left: 14px;
      border-left: 3px solid var(--teal);
    }

    .alert-box {
      padding: 18px;
      border-radius: 14px;
      margin-bottom: 16px;
      border-left: 6px solid;
    }

    .alert-danger {
      background: var(--danger-bg);
      border-color: var(--danger-border);
      color: var(--danger-text);
    }

    .alert-warn {
      background: var(--warn-bg);
      border-color: var(--warn-border);
      color: var(--warn-text);
    }

    .avoid-box {
      background: var(--avoid-bg);
      border: 1px solid #FED7AA;
      border-left: 6px solid var(--avoid-border);
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .avoid-box h3 {
      margin: 0 0 8px;
      font-size: 19px;
      color: var(--avoid-text);
    }

    .info-box {
      background: var(--teal-soft);
      border: 1px solid #99F6E4;
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .info-box h3 {
      margin: 0 0 8px;
      font-size: 19px;
      color: var(--teal-dark);
    }

    .gear-box {
      background: #FFFFFF;
      border: 2px solid #99F6E4;
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .gear-box h3 {
      margin: 0 0 8px;
      font-size: 19px;
      color: var(--teal-dark);
    }

    .gear-tip {
      margin-top: 10px;
      padding: 10px 14px;
      background: #F8FAFC;
      border-radius: 10px;
      font-size: 16px;
      color: var(--muted);
    }

    .track-box {
      background: #F8FAFC;
      border: 1px solid #CBD5E1;
      border-radius: 14px;
      padding: 16px 18px;
      margin-bottom: 16px;
    }

    .track-box h3 {
      margin: 0 0 8px;
      font-size: 19px;
      color: var(--text);
    }

    ul {
      margin: 8px 0 0;
      padding-left: 22px;
    }

    li {
      margin-bottom: 8px;
    }

    .note-box {
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #F8FAFC;
